services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saveguard
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: saveguard
    ports:
      - "5432:5432"
    volumes:
      - saveguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saveguard -d saveguard"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  saveguard_pg:
